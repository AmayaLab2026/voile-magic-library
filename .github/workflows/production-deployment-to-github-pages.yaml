name: 构建并部署到 GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 关键修复：授予工作流向仓库（gh-pages分支）写入的权限
permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建文档
        run: pnpm docs:build

      - name: 推送到 gh-pages 分支
        timeout-minutes: 10
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .vitepress/dist
          branch: gh-pages
